name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Root Directory ==="
          ls -la
          echo ""
          echo "=== Checking gradlew ==="
          find . -name "gradlew" -type f
          echo ""
          echo "=== Full Directory Structure ==="
          find . -type f -name "*.gradle" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Manually
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✓ gradlew found and made executable"
          else
            echo "✗ gradlew not found! Creating one..."
            ./gradlew --version 2>/dev/null || echo "Gradlew wrapper missing"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -q --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/outputs/
            build/
