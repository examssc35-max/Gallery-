name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2.0.10

      - name: Install SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android Components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Creating Gradle wrapper..."
            gradle wrapper --gradle-version=9.3.1 --distribution-type=bin 2>&1 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✓ Gradle wrapper ready"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -q
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/
            build/
