name: Build CloudGallery APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee build.log

      - name: Show APK files
        if: success()
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloudGallery-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CloudGallery-Build-Error-Log
          path: build.log
          if-no-files-found: warn
